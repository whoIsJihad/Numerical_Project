name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      require_complete:
        description: "Fail if any acceptance test is still skipped (final release gate)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Compile source and entry points
        run: python -m compileall -q src experiments
      - name: Tests (pending numerical templates are reported as skipped)
        run: python -m pytest --junitxml=junit.xml
      - name: Require all acceptance tests before final release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_complete }}
        run: python tools/check_no_skips.py junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-python-${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: warn
